<!DOCTYPE html>
<html>
<head>
<title>Task4</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-image:
        linear-gradient(#ddd 1px, transparent 1px),
        linear-gradient(90deg, #ddd 1px, transparent 1px);

    background-size: 10px 10px;
}

.container{
    width:300px;
    height:200px;
    border:2px solid black;
    position:relative;
    margin:50px;
}

.smallbox{
    width:60px;
    height:40px;
    border:2px solid black;
    position:absolute;
    bottom:10px;
    right:10px;
    text-align:center;
    font-size:12px;
}
</style>
</head>

<body>

<h2>Absolute Position Example</h2>

<div class="container">
    Container Area  
    <div class="smallbox">
        Bottom Right
    </div>
</div>

<p>
Container size: <b>300px x 200px</b> → 30 x 20 grid squares  
Bottom Right box: <b>60px x 40px</b> → 6 x 4 grid squares
</p>

</body>
</html>
